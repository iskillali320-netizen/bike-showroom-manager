<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bike Showroom Manager</title>
<meta name="description" content="Stock, invoices, payments, instalments and FBR sales tax records for motorcycle showrooms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: top bar + tab rail, one working panel per tab; ledger-style tables with mono figures */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --sunk:#eceeea; --line:#d9ddd6; --fg:#1b211e; --muted:#5d6762;
  --accent:#0d6a55; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --ok:#1f7a3a; --ok-soft:#e1f2e5; --warn:#9a5b00; --warn-soft:#fbeed3; --bad:#b3261e; --bad-soft:#f9e1de;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --sunk:#222924; --line:#323b36; --fg:#e7ece9; --muted:#9aa6a0;
  --accent:#4cc3a2; --accent-ink:#0b1d17; --accent-soft:#183a31;
  --ok:#6fd08b; --ok-soft:#1b3323; --warn:#f0b65a; --warn-soft:#3a2d14; --bad:#ff8a80; --bad-soft:#3d1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --sunk:#222924; --line:#323b36; --fg:#e7ece9; --muted:#9aa6a0;
  --accent:#4cc3a2; --accent-ink:#0b1d17; --accent-soft:#183a31;
  --ok:#6fd08b; --ok-soft:#1b3323; --warn:#f0b65a; --warn-soft:#3a2d14; --bad:#ff8a80; --bad-soft:#3d1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 13px var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.between{justify-content:space-between;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f.grow{flex:1 1 200px}
input,select,textarea{font:14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{font-family:var(--mono);font-size:13px;min-height:96px;resize:vertical}
input[type=number]{font-family:var(--mono)}
.btn{font:600 13px var(--body);border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--sunk);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}
tfoot td{font-weight:600;background:var(--sunk)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:70ch}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:12.5px}
.chip b{font-family:var(--mono)}
.picklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pick{display:grid;grid-template-columns:auto 1fr 140px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick input[type=checkbox]{width:auto}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 24px;max-width:360px;margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.totals .t{font-weight:600;border-top:1px solid var(--line);padding-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(860px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.inv-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.inv-head .big{font-family:var(--display);font-size:20px;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){.pick{grid-template-columns:auto 1fr}.pick input[type=number]{grid-column:2}}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--display);font-weight:800;font-size:20px}
.linkbtn{background:none;border:0;color:var(--accent);font:500 13px var(--body);cursor:pointer;padding:4px 0;text-align:left}
#shopSwitch{width:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth" class="authwrap"><div class="authcard"><div class="brand">Bike Showroom Manager</div><p class="sub">Loading…</p></div></section>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1 id="bizName">Bike Showroom Manager</h1>
      <div class="sub" id="bizSub">Stock from factory · dealers & customers · invoices · payments · FBR</div>
    </div>
    <div class="row" style="align-items:center"><select id="shopSwitch" hidden aria-label="Showroom"></select><span class="sub" id="syncState">Connecting…</span><button class="btn sm" data-act="signout">Sign out</button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const TABS=[["overview","Overview"],["stock","Stock"],["sales","Sales & Invoices"],["payments","Payments"],["parties","Dealers & Customers"],["instal","Instalments"],["fbr","FBR / Tax"],["settings","Settings"]];
const S={bikes:[],parties:[],invoices:[],payments:[],settings:{}};
let tab="overview", ready=false, ui={stockFilter:"in_stock",stockQ:"",fbrMonth:today().slice(0,7),partyFilter:"all"};
try{const t=localStorage.getItem("bsm_tab");if(t&&TABS.some(x=>x[0]===t))tab=t;}catch(e){}

/* ---------- helpers ---------- */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:0;};
const r2=n=>Math.round(n*100)/100;
const rs=n=>"Rs "+Number(r2(n)).toLocaleString("en-PK",{maximumFractionDigits:2});
const fmtN=n=>Number(r2(n)).toLocaleString("en-PK",{maximumFractionDigits:2});
const fmtD=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return dd+"-"+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+"-"+y;};
function addMonths(d,k){const [y,m,dd]=d.split("-").map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(dd,last)).padStart(2,"0");}
const $=s=>document.querySelector(s);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
const party=id=>S.parties.find(p=>p.id===id);
const bike=id=>S.bikes.find(b=>b.id===id);
const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
function paidFor(inv){return sum(S.payments.filter(p=>p.invoiceId===inv.id),p=>p.amount);}
function invBal(inv){return r2(num(inv.total)-paidFor(inv));}
function partyStats(pid){const inv=S.invoices.filter(i=>i.partyId===pid);const billed=sum(inv,i=>i.total);const paid=sum(S.payments.filter(p=>p.partyId===pid),p=>p.amount);return{inv,billed,paid,bal:r2(billed-paid),bikes:sum(inv,i=>(i.items||[]).length)};}
function settings(){return Object.assign({name:"",address:"",phone:"",ntn:"",strn:"",taxRate:18,prefix:"INV-"},S.settings);}
function nextInvNo(){const st=settings();let max=0;S.invoices.forEach(i=>{const m=String(i.no||"").match(/(\d+)\s*$/);if(m)max=Math.max(max,+m[1]);});return st.prefix+String(max+1).padStart(4,"0");}
function csv(rows){return rows.map(r=>r.map(c=>{c=String(c??"");return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\r\n");}
async function save(filename,data){
  if(!dl){toast("Downloads aren't available in this view");return;}
  try{await dl.save({filename,data});}catch(e){if(e&&e.code==="declined")return;toast("Couldn't save file: "+(e&&e.message||"unavailable"));}
}
function schedule(inv){
  if(inv.plan!=="instalment")return null;
  const total=num(inv.total),down=num(inv.down),months=Math.max(1,num(inv.months)|0);
  const fin=r2(total-down),each=r2(fin/months);
  let paid=paidFor(inv)-down; const rows=[]; const t=today();
  for(let i=0;i<months;i++){
    const amt=i===months-1?r2(fin-each*(months-1)):each;
    const due=addMonths(inv.startDate||inv.date,i);
    const got=Math.max(0,Math.min(amt,paid));paid-=got;
    const status=got>=amt-0.01?"paid":(due<t?"overdue":(got>0?"part":"due"));
    rows.push({n:i+1,due,amt,got:r2(got),status});
  }
  return {down,each,fin,rows,downPaid:paidFor(inv)>=down-0.01};
}
async function guard(fn){
  if(!sb||!shop){toast("Please sign in first");return false;}
  try{await fn();await loadAll();return true;}catch(e){console.error(e);
    const m=String(e&&(e.message||e.details)||"try again");
    toast(/row-level security|permission/i.test(m)?"Only the owner can do this.":/bikes_chassis_unique|duplicate key/i.test(m)?"That chassis number is already in stock.":/Failed to fetch|NetworkError/i.test(m)?"No internet connection. Try again.":"Couldn't save: "+m);
    return false;}
}
/* ---------- data (Supabase) ---------- */
let sb=null, me=null, shop=null, role="staff", shops=[], chan=null;
S.members=[];S.invites=[];
const isOwner=()=>role==="owner";
const camel=s=>s.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
const snake=s=>s.replace(/[A-Z]/g,c=>"_"+c.toLowerCase());
const fromRow=r=>{const o={};for(const k in r)o[camel(k)]=r[k];return o;};
const NULLABLE=new Set(["invoice_id","sold_to","sold_date","party_id","start_date","down","months","received_date","date"]);
const toRow=o=>{const r={};for(const k in o){if(k==="id"||k==="createdAt")continue;const s=snake(k);let v=o[k];if(v===""&&NULLABLE.has(s))v=null;r[s]=v;}return r;};
const q=async p=>{const {data,error}=await p;if(error)throw error;return data;};
async function fetchAll(table){let out=[],from=0;for(;;){const data=await q(sb.from(table).select("*").eq("showroom_id",shop.id).order("created_at").range(from,from+999));out=out.concat(data);if(data.length<1000)break;from+=1000;}return out.map(fromRow);}
let loading=null,again=false;
async function loadAll(){
  if(!shop)return;
  if(loading){again=true;return loading;}
  loading=(async()=>{try{
    const [b,p,i,y]=await Promise.all(["bikes","parties","invoices","payments"].map(fetchAll));
    S.bikes=b;S.parties=p;S.invoices=i;S.payments=y;
    const row=await q(sb.from("showrooms").select("*").eq("id",shop.id).single());
    shop=row;S.settings=fromRow(row);S.settings.taxRate=num(row.tax_rate);
    S.members=(await q(sb.from("members").select("user_id,email,role").eq("showroom_id",shop.id))).map(fromRow);
    S.invites=isOwner()?(await q(sb.from("invites").select("*").eq("showroom_id",shop.id))).map(fromRow):[];
    ready=true;$("#syncState").textContent="Online · "+(me&&me.email||"")+" · "+(isOwner()?"Owner":"Staff");render();
  }catch(e){console.error(e);$("#syncState").textContent="Couldn't load. Check your internet and reload.";}finally{loading=null;if(again){again=false;loadAll();}}})();
  return loading;
}
let reloadT;const reloadSoon=()=>{clearTimeout(reloadT);reloadT=setTimeout(loadAll,400);};
const dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return{status:"saved"};}};

/* ---------- sign in ---------- */
let authMode="signin";
function showAuth(mode,msg){
  authMode=mode;$("#app").hidden=true;const a=$("#auth");a.hidden=false;
  const f={
    signin:`<h2>Sign in</h2><label class="f"><span>Email</span><input id="auEmail" type="email" autocomplete="email"></label><label class="f"><span>Password</span><input id="auPass" type="password" autocomplete="current-password"></label><button class="btn primary" data-auth="signin">Sign in</button><div class="row between"><button class="linkbtn" data-auth-go="signup">Create an account</button><button class="linkbtn" data-auth-go="forgot">Forgot password?</button></div>`,
    signup:`<h2>Create account</h2><label class="f"><span>Email</span><input id="auEmail" type="email" autocomplete="email"></label><label class="f"><span>Password (at least 8 characters)</span><input id="auPass" type="password" autocomplete="new-password"></label><button class="btn primary" data-auth="signup">Create account</button><button class="linkbtn" data-auth-go="signin">I already have an account</button>`,
    forgot:`<h2>Reset password</h2><label class="f"><span>Email</span><input id="auEmail" type="email" autocomplete="email"></label><button class="btn primary" data-auth="forgot">Send reset link</button><button class="linkbtn" data-auth-go="signin">Back to sign in</button>`,
    reset:`<h2>Set a new password</h2><label class="f"><span>New password</span><input id="auPass" type="password" autocomplete="new-password"></label><button class="btn primary" data-auth="reset">Save password</button>`,
    create:`<h2>Set up your showroom</h2><p class="note">You're signed in as ${esc(me&&me.email)}. Enter your showroom's name to start. If your owner invited you as staff, ask them to invite this exact email, then sign in again.</p><label class="f"><span>Showroom name</span><input id="auShop"></label><button class="btn primary" data-auth="create">Create showroom</button><button class="linkbtn" data-auth="signout">Sign out</button>`,
    setup:`<h2>Almost ready</h2><p class="note">This copy isn't connected to its database yet. Put your Supabase Project URL and anon key in <b>config.js</b> (see README).</p>`
  }[mode];
  a.innerHTML=`<div class="authcard stack"><div><div class="brand">Bike Showroom Manager</div><div class="sub">Stock · invoices · payments · FBR</div></div>${msg?`<p class="banner">${esc(msg)}</p>`:""}${f}</div>`;
  const first=a.querySelector("input");if(first)first.focus();
}
const AUTH={
  async signin(){const {error}=await sb.auth.signInWithPassword({email:$("#auEmail").value.trim(),password:$("#auPass").value});if(error){showAuth("signin",error.message==="Invalid login credentials"?"Wrong email or password.":error.message);return;}const {data:{user}}=await sb.auth.getUser();await afterLogin(user);},
  async signup(){const email=$("#auEmail").value.trim(),pw=$("#auPass").value;if(pw.length<8){toast("Password must be at least 8 characters");return;}
    const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error){showAuth("signup",error.message);return;}
    if(data.session){await afterLogin(data.user);}else showAuth("signin","Account created. Open the confirmation email we sent to "+email+", then sign in.");},
  async forgot(){const email=$("#auEmail").value.trim();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});showAuth("signin",error?error.message:"If "+email+" has an account, a reset link is on its way.");},
  async reset(){const pw=$("#auPass").value;if(pw.length<8){toast("Password must be at least 8 characters");return;}const {error}=await sb.auth.updateUser({password:pw});if(error){showAuth("reset",error.message);return;}const {data:{user}}=await sb.auth.getUser();toast("Password changed");await afterLogin(user);},
  async create(){const name=$("#auShop").value.trim();if(!name){toast("Enter the showroom name");return;}try{await q(sb.rpc("create_showroom",{p_name:name}));await afterLogin(me);}catch(e){showAuth("create",e.message);}},
  async signout(){if(chan){sb.removeChannel(chan);chan=null;}await sb.auth.signOut();me=null;shop=null;ready=false;showAuth("signin");}
};
async function afterLogin(user){
  me=user;try{await sb.rpc("accept_invites");}catch(e){}
  let rows;try{rows=await q(sb.from("members").select("role,showroom_id,showrooms(*)").eq("user_id",user.id));}catch(e){showAuth("signin",e.message);return;}
  shops=rows.filter(r=>r.showrooms);if(!shops.length){showAuth("create");return;}
  let pick=null;try{pick=localStorage.getItem("bsm_shop");}catch(e){}
  await openShop(shops.find(s=>s.showroom_id===pick)||shops[0]);
}
async function openShop(m){
  shop=m.showrooms;role=m.role;ready=false;try{localStorage.setItem("bsm_shop",shop.id);}catch(e){}
  $("#auth").hidden=true;$("#app").hidden=false;
  const sw=$("#shopSwitch");sw.hidden=shops.length<2;sw.innerHTML=shops.map(s=>`<option value="${s.showroom_id}" ${s.showroom_id===shop.id?"selected":""}>${esc(s.showrooms.name)}</option>`).join("");
  renderTabs();render();await loadAll();
  if(chan)sb.removeChannel(chan);
  chan=sb.channel("shop-"+shop.id);
  ["bikes","parties","invoices","payments","showrooms"].forEach(t=>chan.on("postgres_changes",{event:"*",schema:"public",table:t,filter:(t==="showrooms"?"id=eq.":"showroom_id=eq.")+shop.id},reloadSoon));
  chan.subscribe();
}
async function start(){
  const C=window.APP_CONFIG||{};
  if(!window.supabase||!C.supabaseUrl||/YOUR_/.test(C.supabaseUrl+C.supabaseAnonKey)){showAuth("setup");return;}
  sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
  sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")setTimeout(()=>showAuth("reset"),0);});
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.includes("type=recovery"))return;
  if(session)await afterLogin(session.user);else showAuth("signin");
}

function captureForm(){const o={};document.querySelectorAll("#view [id]").forEach(el=>{if(el.matches("input,select,textarea")){o[el.id]=el.type==="checkbox"?el.checked:el.value;}});o.__focus=document.activeElement&&document.activeElement.id;return o;}
function restoreForm(o){for(const k in o){if(k==="__focus")continue;const el=document.getElementById(k);if(!el||el.dataset.fresh)continue;if(el.type==="checkbox")el.checked=o[k];else if(el.tagName==="SELECT"){if([...el.options].some(op=>op.value===o[k]))el.value=o[k];}else el.value=o[k];}
  if(o.__focus){const f=document.getElementById(o.__focus);if(f)f.focus();}}

function readInvForm(){
  const tax=num($("#invTax")?.value),fur=num($("#invFurther")?.value),incl=$("#invIncl")?.value==="incl";
  const items=[];document.querySelectorAll("[data-pick]").forEach(c=>{if(c.checked){const b=bike(c.dataset.pick);if(b)items.push({bikeId:b.id,model:b.model||"",colour:b.colour||"",engine:b.engine||"",chassis:b.chassis||"",entered:num(document.getElementById("pp_"+b.id).value)});}});
  const rate=(tax+fur)/100;
  items.forEach(it=>{it.price=r2(incl?it.entered/(1+rate):it.entered);});
  const subtotal=r2(sum(items,i=>i.price)),t=r2(subtotal*tax/100),f=r2(subtotal*fur/100);
  let total=r2(subtotal+t+f); if(incl){const want=r2(sum(items,i=>i.entered));if(Math.abs(want-total)<1)total=want;}
  items.forEach(i=>delete i.entered);
  return {items,subtotal,taxRate:tax,tax:t,furtherRate:fur,furtherTax:f,total};
}

function vInstal(){

  rows.sort((a,b)=>b.odAmt-a.odAmt||((a.next?.due||"9")).localeCompare(b.next?.due||"9"));

}

function openModal(html){$("#modalRoot").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$("#modalRoot .modal button");if(f)f.focus();}

function partyStatement(pid){
  const ev=[];S.invoices.filter(i=>i.partyId===pid).forEach(i=>ev.push({date:i.date,d:"Invoice "+i.no+" · "+(i.items||[]).length+" bike(s)",dr:num(i.total),cr:0,inv:i.id}));
  S.payments.filter(p=>p.partyId===pid).forEach(p=>ev.push({date:p.date,d:"Payment · "+(p.method||"")+(p.ref?" · "+p.ref:""),dr:0,cr:num(p.amount)}));
  ev.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||b.dr-a.dr);let bal=0;ev.forEach(e=>{bal=r2(bal+e.dr-e.cr);e.bal=bal;});return ev;
}
function showParty(pid){
  const p=party(pid);if(!p){closeModal();return;}openPartyId=pid;openInvId=null;const s=partyStats(pid),ev=partyStatement(pid);
  openModal(`<div class="row between"><h2>${esc(p.name)}</h2><button class="btn" data-close="1">Close</button></div>

  ${ev.length?`<div class="tablebox"><table><thead><tr><th>Date</th><th>Details</th><th class="n">Billed</th><th class="n">Received</th><th class="n">Balance</th></tr></thead><tbody>${ev.map(e=>`<tr ${e.inv?`class="click" data-inv="${e.inv}"`:""}><td>${fmtD(e.date)}</td><td>${esc(e.d)}</td><td class="n">${e.dr?fmtN(e.dr):""}</td><td class="n">${e.cr?fmtN(e.cr):""}</td><td class="n">${fmtN(e.bal)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No invoices or payments yet.</div>`}

function captureModal(){const f=$("#mFbr");return f?{fbr:f.value,focus:document.activeElement===f}:null;}

/* ---------- actions ---------- */
const ownerOnly=()=>{if(isOwner())return true;toast("Only the owner can do this.");return false;};
const A={
  async receive(){
    const lines=$("#rcvLines").value.split(/\n/).map(l=>l.trim()).filter(Boolean);
    const model=$("#rcvModel").value.trim();
    if(!model){toast("Enter the model");return;} if(!lines.length){toast("Enter at least one engine/chassis line");return;}
    const existing=new Set(S.bikes.map(b=>(b.chassis||"").toUpperCase()).filter(Boolean));const dup=[];
    const bikes=lines.map(l=>{const [e,c]=l.split(/[,\t;]+/).map(x=>(x||"").trim());return{engine:e||"",chassis:c||""};});
    const seen=new Set();bikes.forEach(b=>{const k=b.chassis.toUpperCase();if(k&&(existing.has(k)||seen.has(k)))dup.push(b.chassis);seen.add(k);});
    if(dup.length){toast("Chassis already entered: "+dup.slice(0,3).join(", "));return;}
    const base={showroomId:shop.id,model,colour:$("#rcvColour").value.trim(),cost:num($("#rcvPrice").value),challan:$("#rcvChallan").value.trim(),receivedDate:$("#rcvDate").value||today(),status:"in_stock"};
    const ok=await guard(()=>q(sb.from("bikes").insert(bikes.map(b=>toRow(Object.assign({},base,b))))));
    if(ok){$("#rcvLines").value="";$("#rcvCount").textContent="";toast(bikes.length+" bike(s) added to stock");}
  },
  async saveInv(){
    const pid=$("#invParty").value,p=party(pid);if(!p){toast("Choose who the bikes are sold to");return;}
    const x=readInvForm();if(!x.items.length){toast("Tick at least one bike");return;}
    if(x.items.some(i=>!i.price)){toast("Enter a sale price for every ticked bike");return;}
    const plan=$("#invPlan").value==="instalment"?"instalment":"full";
    const inv=Object.assign(x,{showroomId:shop.id,date:$("#invDate").value||today(),partyId:pid,fbrNo:$("#invFbr").value.trim(),plan,notes:$("#invNotes").value.trim()});
    if(plan==="instalment"){inv.down=num($("#invDown").value);inv.months=Math.max(1,num($("#invMonths").value)|0);inv.startDate=$("#invStart").value||addMonths(inv.date,1);}
    const recv=num($("#invRecv").value);let made=null;
    const ok=await guard(async()=>{made=await q(sb.rpc("create_invoice",{p:toRow(inv),pay:recv>0?{amount:recv,method:$("#invMethod").value,ref:"At sale"}:null}));});
    if(ok&&made){["invRecv","invNotes","invFbr","invDown"].forEach(k=>{const e=document.getElementById(k);if(e)e.value="";});const pl=$("#invPlan");if(pl){pl.value="full";updateInvTotals();}toast("Invoice "+made.no+" saved");showInvoice(made.id);}
  },
  async savePay(){
    const pid=$("#payParty").value;if(!party(pid)){toast("Choose who paid");return;}
    const amt=num($("#payAmt").value);if(amt<=0){toast("Enter the amount received");return;}
    const invId=$("#payInv").value;const date=$("#payDate").value||today(),method=$("#payMethod").value,ref=$("#payRef").value.trim();
    const rows=[];const row=(invoiceId,amount,r)=>rows.push(toRow({showroomId:shop.id,partyId:pid,invoiceId,amount,date,method,ref:r}));
    if(invId)row(invId,amt,ref);else{
      let left=amt;const open=S.invoices.filter(i=>i.partyId===pid&&invBal(i)>0.01).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      for(const i of open){if(left<=0)break;const part=r2(Math.min(left,invBal(i)));row(i.id,part,ref);left=r2(left-part);}
      if(left>0)row("",left,ref||"Advance");}
    if(await guard(()=>q(sb.from("payments").insert(rows)))){$("#payAmt").value="";$("#payRef").value="";toast("Payment of "+rs(amt)+" saved");}
  },
  async saveParty(){
    const name=$("#ptName").value.trim();if(!name){toast("Enter a name");return;}
    const d={showroomId:shop.id,type:$("#ptType").value,name,phone:$("#ptPhone").value.trim(),cnic:$("#ptCnic").value.trim(),ntn:$("#ptNtn").value.trim(),address:$("#ptAddr").value.trim()};
    if(await guard(()=>q(sb.from("parties").insert(toRow(d))))){["ptName","ptPhone","ptCnic","ptNtn","ptAddr"].forEach(k=>$("#"+k).value="");toast(name+" added");}
  },
  async saveSettings(){if(!ownerOnly())return;
    const d={name:$("#stName").value.trim()||shop.name,address:$("#stAddr").value.trim(),phone:$("#stPhone").value.trim(),ntn:$("#stNtn").value.trim(),strn:$("#stStrn").value.trim(),tax_rate:num($("#stTax").value),prefix:$("#stPrefix").value.trim()||"INV-"};
    if(await guard(()=>q(sb.from("showrooms").update(d).eq("id",shop.id))))toast("Details saved");
  },
  async saveFbr(){const v=$("#mFbr").value.trim();if(await guard(()=>q(sb.from("invoices").update({fbr_no:v}).eq("id",openInvId))))toast("FBR number saved");},
  dlInv(){const inv=S.invoices.find(i=>i.id===openInvId);if(!inv)return;
    const style=document.querySelector("style").textContent;
    const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.no)}</title><style>${style} body{padding:24px;max-width:860px;margin:auto} .modal{border:0}</style></head><body><div class="modal">${invoiceHtml(inv,true)}<p class="sub">Press Ctrl+P to print or save as PDF.</p></div></body></html>`;
    save(`${inv.no} ${inv.partyName}.html`.replace(/[\\/:*?"<>|]/g,"-"),html);},
  payThis(){const inv=S.invoices.find(i=>i.id===openInvId);if(!inv)return;closeModal();go("payments");$("#payParty").value=inv.partyId;fillPayInvoices();$("#payInv").value=inv.id;$("#payAmt").value=Math.max(0,invBal(inv));$("#payAmt").focus();},
  askDelInv(){if(!ownerOnly())return;$("#delInvWrap").innerHTML=`<span class="sub">Delete invoice, its payments, and return bikes to stock?</span><button class="btn sm danger" data-act="delInv">Yes, delete</button><button class="btn sm" data-act="cancelModal">Cancel</button>`;},
  cancelModal(){rerenderModal();},
  async delInv(){const id=openInvId;if(await guard(()=>q(sb.rpc("delete_invoice",{p_id:id})))){closeModal();toast("Invoice deleted");}},
  askDelParty(){if(!ownerOnly())return;$("#delPartyWrap").innerHTML=`<span class="sub">Delete this person?</span><button class="btn sm danger" data-act="delParty">Yes</button><button class="btn sm" data-act="cancelModal">Cancel</button>`;},
  async delParty(){const id=openPartyId;if(await guard(()=>q(sb.from("parties").delete().eq("id",id)))){closeModal();toast("Deleted");}},
  askDelBike(el){if(!ownerOnly())return;const w=el.closest("[data-del-wrap]");w.innerHTML=`<button class="btn sm danger" data-act="delBike" data-id="${el.dataset.id}">Confirm</button><button class="btn sm" data-act="rerender">Cancel</button>`;},
  async delBike(el){if(await guard(()=>q(sb.from("bikes").delete().eq("id",el.dataset.id))))toast("Bike removed from stock");},
  askDelPay(el){if(!ownerOnly())return;const w=el.closest("[data-del-wrap]");w.innerHTML=`<button class="btn sm danger" data-act="delPay" data-id="${el.dataset.id}">Confirm</button><button class="btn sm" data-act="rerender">Cancel</button>`;},
  async delPay(el){if(await guard(()=>q(sb.from("payments").delete().eq("id",el.dataset.id))))toast("Payment deleted");},
  async invite(){if(!ownerOnly())return;const email=$("#invEmail").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){toast("Enter a valid email");return;}
    if(await guard(()=>q(sb.from("invites").insert({showroom_id:shop.id,email,role:$("#invRole").value})))){$("#invEmail").value="";toast("Invited "+email+". Ask them to create an account with this email.");}},

  signout(){AUTH.signout();},
  rerender(){render();},
  stockCsv(){const rows=[["Received","Model","Colour","Engine no","Chassis no","Challan","Cost","Status","Sold to","Invoice"]];
    S.bikes.forEach(b=>{const inv=S.invoices.find(i=>i.id===b.invoiceId);rows.push([b.receivedDate,b.model,b.colour,b.engine,b.chassis,b.challan,b.cost,b.status==="sold"?"Sold":"In stock",inv?inv.partyName:"",inv?inv.no:""]);});
    save("stock-"+today()+".csv",csv(rows));},
  fbrCsv(){const st=settings();const rows=[["Seller NTN","Seller STRN","Invoice date","Invoice no","FBR invoice no","Buyer name","Buyer type","Buyer NTN","Buyer CNIC","Item","Engine no","Chassis no","Value excl tax","Sales tax rate %","Sales tax","Further tax rate %","Further tax","Total incl tax"]];
    fbrRows(ui.fbrMonth).forEach(i=>{const items=i.items||[];items.forEach(it=>{const share=num(i.subtotal)?num(it.price)/num(i.subtotal):0;rows.push([st.ntn,st.strn,i.date,i.no,i.fbrNo,i.partyName,i.partyType==="dealer"?"Dealer":"Customer",i.buyerNtn,i.buyerCnic,(it.model+" "+it.colour).trim(),it.engine,it.chassis,r2(it.price),i.taxRate,r2(num(i.tax)*share),i.furtherRate,r2(num(i.furtherTax)*share),r2(num(i.total)*share)]);});});
    save("fbr-sales-"+ui.fbrMonth+".csv",csv(rows));},
  dlStatement(){const p=party(openPartyId);if(!p)return;const rows=[["Date","Details","Billed","Received","Balance"]];partyStatement(p.id).forEach(e=>rows.push([e.date,e.d,e.dr||"",e.cr||"",e.bal]));save(("statement-"+p.name+"-"+today()+".csv").replace(/[\\/:*?"<>|]/g,"-"),csv(rows));},
  backup(){const {bikes,parties,invoices,payments,settings}=S;save("showroom-backup-"+today()+".json",JSON.stringify({exported:new Date().toISOString(),bikes,parties,invoices,payments,settings},null,2));}
};

function go(t){tab=t;try{localStorage.setItem("bsm_tab",t);}catch(e){}renderTabs();render();window.scrollTo(0,0);}

document.addEventListener("click",e=>{
  const t=e.target;
  const au=t.closest("[data-auth]");if(au){e.preventDefault();au.disabled=true;Promise.resolve(AUTH[au.dataset.auth]()).finally(()=>{au.disabled=false;});return;}
  const ag=t.closest("[data-auth-go]");if(ag){showAuth(ag.dataset.authGo);return;}
  const tb=t.closest("[data-tab]");if(tb){go(tb.dataset.tab);return;}
  const g=t.closest("[data-go]");if(g){go(g.dataset.go);return;}
  if(t.matches("[data-close]")){closeModal();openInvId=openPartyId=null;return;}
  const a=t.closest("[data-act]");if(a){e.preventDefault();A[a.dataset.act]&&A[a.dataset.act](a);return;}
  const iv=t.closest("[data-inv]");if(iv&&!t.matches("input,select")){showInvoice(iv.dataset.inv);return;}
  const pt=t.closest("[data-party]");if(pt){showParty(pt.dataset.party);return;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#auth")&&e.target.matches("input")){const b=$("#auth [data-auth]");if(b)b.click();return;}if(e.key==="Escape"&&$("#modalRoot").innerHTML){closeModal();openInvId=openPartyId=null;}});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="stockQ"){ui.stockQ=e.target.value;const pos=e.target.selectionStart;render();const q=$("#stockQ");q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}
  if(tab==="sales"){if(e.target.dataset.price){const c=document.getElementById("pk_"+e.target.dataset.price);if(c&&e.target.value)c.checked=true;}updateInvTotals();}
  if(id==="rcvLines"){const n=e.target.value.split(/\n/).filter(l=>l.trim()).length;$("#rcvCount").textContent=n?n+" bike(s) ready to add":"";}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="stockFilter"){ui.stockFilter=e.target.value;render();}
  if(id==="partyFilter"){ui.partyFilter=e.target.value;render();}
  if(id==="fbrMonth"){ui.fbrMonth=e.target.value||today().slice(0,7);render();}
  if(id==="payParty")fillPayInvoices();
  if(id==="shopSwitch"){const m=shops.find(s=>s.showroom_id===e.target.value);if(m)openShop(m);}
  if(tab==="sales")updateInvTotals();
});
/* live updates: re-render the current tab and any open modal */
const _render=render;render=function(){_render();rerenderModal();};
start();
})();
</script>
</body>
</html>
